name: Continuous Integration

on: pull_request

jobs:
  continuos-Integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: using Node.jobs
        uses: actions/setup-node@v2
        with:
          node-version: 22
      - name: run install, test
        run: |
          npm install
          npm run test
